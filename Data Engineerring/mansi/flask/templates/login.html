<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Data Portal</title>

    <!-- OLD THEME CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <!-- CARTOON CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cartoon.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<a href="/" class="back-home-btn">← BACK TO HOME</a>

<div class="hero-container">

    <!-- CARTOON CHARACTER -->
    <div class="cartoon">
        <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="hand left-hand"></div>
            <div class="hand right-hand"></div>
        </div>
    </div>

    <div class="auth-card">
        <h2>LOGIN</h2>

        <form action="/login" method="POST">

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group password-group">
                <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                <span class="toggle-password" id="togglePass">👁</span>
            </div>

            <button type="submit" class="cta-button">LOGIN</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/signup">Click here</a>
        </p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/cartoon.js') }}"></script>
</body>
</html>
